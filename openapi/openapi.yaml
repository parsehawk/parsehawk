          - $ref: '#/components/schemas/ReasoningEffort'
          - type: 'null'
          description: Optional reasoning effort passed to models that support it.
        provider_name:
          anyOf:
          - $ref: '#/components/schemas/ProviderName'
          - type: 'null'
          description: Configured provider to use.
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Provider model identifier.
      additionalProperties: false
      type: object
      required:
      - display_name
      title: UpsertParserRequest
      description: Complete parser definition used to create or replace a parser by reference.
    ValidateSchemaRequest:
      properties:
        schema:
          additionalProperties: true
          type: object
          title: Schema
          description: ParseHawk extraction schema. This is the public authoring dialect documented in
            docs/schemas/parsehawk-extraction-schema.schema.json.
          examples:
          - additionalProperties: false
            properties:
              invoice_number:
                type:
                - string
                - 'null'
                x-parsehawk:
                  semantic: verbatim-string
              total:
                type: number
              currency:
                type: string
                x-parsehawk:
                  semantic: currency
            required:
            - invoice_number
            - total
            - currency
            type: object
      additionalProperties: false
      type: object
      required:
      - schema
      title: ValidateSchemaRequest
      description: Request to validate a ParseHawk extraction schema.
    ValidateSchemaResponse:
      properties:
        valid:
          type: boolean
          title: Valid
          description: Whether the schema is accepted by ParseHawk.
        schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Schema
          description: Canonical ParseHawk extraction schema when validation succeeds.
        warnings:
          items:
            $ref: '#/components/schemas/SchemaDiagnostic'
          type: array
          title: Warnings
          description: Non-blocking diagnostics.
        errors:
          items:
            $ref: '#/components/schemas/SchemaDiagnostic'
          type: array
          title: Errors
          description: Blocking diagnostics that make the schema invalid.
      additionalProperties: false
      type: object
      required:
      - valid
      title: ValidateSchemaResponse
      description: Validation result and canonical schema when accepted.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
